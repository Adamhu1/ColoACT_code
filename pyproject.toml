[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coloact"
version = "0.1.0"
description = "RGB-D-E Action Chunking Transformer for autonomous colon navigation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "torch",
    "torchvision",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
